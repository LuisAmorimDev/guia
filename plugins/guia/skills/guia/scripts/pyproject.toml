[project]
name = "guia-scripts"
version = "0.1.0"
description = "Scripts da skill /guia: normalização pt-PT, personas, TTS, timing"
requires-python = ">=3.11"
dependencies = [
  "num2words>=0.5.13",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "azure-cognitiveservices-speech>=1.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
